<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal de Superfícies</title>
<style>
:root{--bg:#eef2f6;--panel:#fff;--line:#d5dce4;--text:#1b2430;--muted:#687789;--blue:#2367e8;--danger:#b3261e;--green:#228b55}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select{font:inherit}.top{height:58px;background:#17212b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{font-weight:700}.app{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 58px);min-height:680px}.side{background:#fff;border-right:1px solid var(--line);padding:14px;overflow:auto}.main{min-width:0;padding:14px;display:flex;flex-direction:column;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px}.field input,.field select{border:1px solid #c6ced7;border-radius:7px;padding:8px 9px;background:#fff}.btn{border:1px solid #b9c2cc;background:#fff;border-radius:7px;padding:8px 10px;cursor:pointer}.btn:hover{background:#f4f6f8}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{color:var(--danger)}.btn.active{outline:2px solid #9ab7ff}.status{font-size:13px;color:var(--muted);min-height:18px}.surfaces{display:flex;flex-direction:column;gap:7px;margin-top:8px}.surf{border:1px solid var(--line);border-radius:8px;padding:9px}.surf.active{border-color:#84a8ff;background:#f3f7ff}.muted{font-size:12px;color:var(--muted)}.tag{font-size:11px;padding:3px 6px;border-radius:10px;background:#e9eef4}.viewer{position:relative;flex:1;min-height:430px;background:#f9fbfd;border:1px solid var(--line);border-radius:10px;overflow:hidden}.viewer canvas{display:block;width:100%;height:100%;cursor:crosshair}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.stat{background:#f5f7fa;border-radius:7px;padding:9px}.stat b{font-size:17px;display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.section-result{max-height:250px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}.profile{width:100%;height:220px;border:1px solid var(--line);border-radius:8px;background:#fcfdff}.hidden{display:none}.help{font-size:12px;color:var(--muted);line-height:1.35}@media(max-width:900px){.app{display:block;height:auto}.side{border-right:0;border-bottom:1px solid var(--line)}.viewer{min-height:520px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top"><div class="brand">🏗 Portal de Superfícies</div><div class="muted" style="color:#cbd5df">SIRGAS 2000 · UTM 22S</div></header>
<div class="app">
<aside class="side">
  <div class="card"><b>Projetos</b><div class="row" style="margin-top:9px"><button class="btn primary" data-sau="SAU3">SAU3</button><button class="btn" data-sau="SAU4">SAU4</button></div></div>
  <div class="card" style="margin-top:10px">
    <b>Nova superfície</b>
    <div class="field" style="margin-top:9px"><label>Nome da evolução</label><input id="name" value="Levantamento"></div>
    <div class="field" style="margin-top:8px"><label>TXT, CSV ou XML/LandXML</label><input id="file" type="file" accept=".txt,.csv,.xml,.landxml,text/plain,application/xml,text/xml"></div>
    <button class="btn primary" id="upload" style="width:100%;margin-top:9px">Gerar superfície</button>
    <div id="uploadStatus" class="status" style="margin-top:7px"></div>
  </div>
  <div class="card" style="margin-top:10px"><b>Evoluções</b><div id="surfaces" class="surfaces"></div></div>
</aside>
<main class="main">
  <div class="card">
    <div class="row"><b id="title">SAU3</b><span id="tag" class="tag">Nenhuma superfície</span><span id="status" class="status"></span></div>
    <div class="stats"><div class="stat"><span class="muted">Pontos</span><b id="points">—</b></div><div class="stat"><span class="muted">Triângulos</span><b id="triangles">—</b></div><div class="stat"><span class="muted">Cota mín.</span><b id="zmin">—</b></div><div class="stat"><span class="muted">Cota máx.</span><b id="zmax">—</b></div></div>
  </div>
  <div class="card"><div class="row">
    <button class="btn active" id="view3d">3D</button><button class="btn" id="viewPlan">Planta</button>
    <button class="btn active" id="orbit">↻ Orbitar</button><button class="btn" id="pan">✋ PAN</button>
    <button class="btn" id="wire">△ Triangulação</button><button class="btn" id="pointsBtn">• Pontos</button><button class="btn" id="fit">⌖ Enquadrar</button>
    <button class="btn danger" id="edgeDelete">✂ Apagar aresta</button><button class="btn" id="saveEdit">💾 Salvar TIN</button>
  </div></div>
  <div class="viewer"><canvas id="canvas"></canvas></div>
  <div class="card">
    <div class="row"><b>Seção A–B</b><span class="tag">interpolada no TIN</span></div>
    <div class="grid2" style="margin-top:9px">
      <div><div class="row"><button class="btn" id="pickA">📍 Selecionar A na planta</button><button class="btn" id="pickB">📍 Selecionar B na planta</button></div><div class="help" style="margin-top:6px">Abra <b>Planta</b> e selecione os pontos A e B clicando no desenho. Também é possível preencher as coordenadas abaixo.</div></div>
      <div class="grid2">
        <div class="field"><label>Este A</label><input id="Ae" type="number" step="0.001"></div><div class="field"><label>Norte A</label><input id="An" type="number" step="0.001"></div>
        <div class="field"><label>Este B</label><input id="Be" type="number" step="0.001"></div><div class="field"><label>Norte B</label><input id="Bn" type="number" step="0.001"></div>
      </div>
    </div>
    <div class="row" style="margin-top:9px"><label class="field" style="min-width:250px"><span>Comparar com</span><select id="reference"><option value="">— sem referência —</option></select></label><button class="btn primary" id="makeSection">Gerar seção</button><span id="sectionStatus" class="status"></span></div>
    <canvas id="profile" class="profile" style="margin-top:9px"></canvas>
    <div id="sectionNumbers" class="muted" style="margin-top:6px"></div>
  </div>
</main></div>
<script>
let sau='SAU3', current=null, surfaces=[], mode='orbit', display='3d', showWire=true, showPoints=false, pickMode=null, selectedEdge=null;
let yaw=-0.6,pitch=0.55,zoom=1,panX=0,panY=0,drag=null;
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d'), profile=$('profile'), pctx=profile.getContext('2d');
function st(msg){$('status').textContent=msg;}
function resize(){const r=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(r.width*devicePixelRatio));canvas.height=Math.max(1,Math.floor(r.height*devicePixelRatio));ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw();const pr=profile.getBoundingClientRect();profile.width=Math.max(1,Math.floor(pr.width*devicePixelRatio));profile.height=Math.max(1,Math.floor(pr.height*devicePixelRatio));pctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);
async function loadList(){const r=await fetch('/api/surfaces/'+sau,{cache:'no-store'});surfaces=await r.json();const el=$('surfaces');el.innerHTML='';$('reference').innerHTML='<option value="">— sem referência —</option>';if(!surfaces.length){el.innerHTML='<div class="muted">Nenhuma superfície cadastrada.</div>';return}surfaces.forEach(x=>{const d=document.createElement('div');d.className='surf'+(current&&current.id===x.id?' active':'');d.innerHTML=`<b>${esc(x.name)}</b><div class="muted">${esc(x.filename)} · ${esc(x.source)}<br>${x.points} pontos · ${x.triangles} triângulos</div><div class="row" style="margin-top:7px"><button class="btn open">Abrir</button><button class="btn danger del">Apagar</button></div>`;d.querySelector('.open').onclick=()=>openSurface(x.id);d.querySelector('.del').onclick=()=>deleteSurface(x.id);el.appendChild(d);const opt=document.createElement('option');opt.value=x.id;opt.textContent=x.name+' · '+x.source;$('reference').appendChild(opt)})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function openSurface(id){const r=await fetch('/api/surface/'+sau+'/'+id,{cache:'no-store'});if(!r.ok){st('Falha ao abrir');return}current=await r.json();$('tag').textContent=current.name;$('points').textContent=current.mesh.points;$('triangles').textContent=current.mesh.triangles;$('zmin').textContent=current.mesh.zmin.toFixed(3);$('zmax').textContent=current.mesh.zmax.toFixed(3);yaw=-.6;pitch=.55;zoom=1;panX=0;panY=0;selectedEdge=null;draw();loadList();st('Superfície carregada')}
async function deleteSurface(id){if(!confirm('Apagar esta superfície?'))return;const r=await fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sau,id})});if(!r.ok){st('Não foi possível apagar');return}if(current?.id===id){current=null;$('tag').textContent='Nenhuma superfície';draw()}await loadList();st('Superfície apagada')}
$('upload').onclick=async()=>{const f=$('file').files[0];if(!f){$('uploadStatus').textContent='Selecione um arquivo primeiro.';return}const fd=new FormData();fd.append('sau',sau);fd.append('name',$('name').value||f.name);fd.append('file',f);$('upload').disabled=true;$('uploadStatus').textContent='Lendo arquivo e calculando TIN...';try{const r=await fetch('/api/upload',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');$('uploadStatus').textContent=`OK · ${d.surface.mesh.points} pontos · ${d.surface.mesh.triangles} triângulos`;await loadList();await openSurface(d.surface.id);$('file').value=''}catch(e){$('uploadStatus').textContent='Erro: '+e.message}finally{$('upload').disabled=false}};
document.querySelectorAll('[data-sau]').forEach(b=>b.onclick=()=>{sau=b.dataset.sau;document.querySelectorAll('[data-sau]').forEach(x=>x.classList.toggle('primary',x===b));current=null;display='3d';$('tag').textContent='Nenhuma superfície';loadList();draw()});
$('view3d').onclick=()=>{display='3d';$('view3d').classList.add('active');$('viewPlan').classList.remove('active');draw()};$('viewPlan').onclick=()=>{display='plan';$('viewPlan').classList.add('active');$('view3d').classList.remove('active');draw()};
$('orbit').onclick=()=>{mode='orbit';$('orbit').classList.add('active');$('pan').classList.remove('active')};$('pan').onclick=()=>{mode='pan';$('pan').classList.add('active');$('orbit').classList.remove('active')};$('wire').onclick=()=>{showWire=!showWire;$('wire').classList.toggle('active',showWire);draw()};$('pointsBtn').onclick=()=>{showPoints=!showPoints;$('pointsBtn').classList.toggle('active',showPoints);draw()};$('fit').onclick=()=>{yaw=-.6;pitch=.55;zoom=1;panX=0;panY=0;draw()};
$('edgeDelete').onclick=()=>{if(!current){st('Abra uma superfície.');return}if(!selectedEdge){st('Clique primeiro em uma aresta no TIN.');return}deleteSelectedEdge()};
async function deleteSelectedEdge(){const [a,b]=selectedEdge;if(!confirm(`Apagar a aresta ${a}–${b}?`))return;const r=await fetch('/api/edge/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sau,id:current.id,a,b})});const d=await r.json();if(!r.ok){st(d.error||'Falha');return}current=d.surface;$('triangles').textContent=current.mesh.triangles;$('tag').textContent=current.name;selectedEdge=null;draw();await loadList();st(d.message)}
$('saveEdit').onclick=async()=>{if(!current){st('Abra uma superfície.');return}const r=await fetch('/api/surface/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sau,surface:current})});const d=await r.json();st(r.ok?'TIN salvo.':(d.error||'Falha ao salvar'))};
$('pickA').onclick=()=>{display='plan';pickMode='A';$('viewPlan').classList.add('active');$('view3d').classList.remove('active');st('Clique na planta para definir A')};$('pickB').onclick=()=>{display='plan';pickMode='B';$('viewPlan').classList.add('active');$('view3d').classList.remove('active');st('Clique na planta para definir B')};
$('makeSection').onclick=async()=>{if(!current){$('sectionStatus').textContent='Abra uma superfície.';return}const A={east:+$('Ae').value,north:+$('An').value},B={east:+$('Be').value,north:+$('Bn').value};if(!Number.isFinite(A.east)||!Number.isFinite(A.north)||!Number.isFinite(B.east)||!Number.isFinite(B.north)){$('sectionStatus').textContent='Preencha A e B.';return}$('sectionStatus').textContent='Calculando...';try{const ref=$('reference').value;const r=await fetch('/api/section',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sau,id:current.id,A,B,reference_id:ref||null})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');drawProfile(d);$('sectionNumbers').textContent=`Comprimento: ${d.length.toFixed(3)} m · ${d.profile.length} pontos interpolados${d.reference?' · referência: '+$('reference').selectedOptions[0].text:''}`;$('sectionStatus').textContent='Seção gerada.'}catch(e){$('sectionStatus').textContent='Erro: '+e.message}};
function project3(v,scale,cx,cy){const z=(v.z-current.mesh.zmin)/(current.mesh.zmax-current.mesh.zmin||1)*150;const cyaw=Math.cos(yaw),syaw=Math.sin(yaw);let x1=v.x*cyaw-v.y*syaw,y1=v.x*syaw+v.y*cyaw;const cp=Math.cos(pitch),sp=Math.sin(pitch);let y2=y1*cp-z*sp;return [cx+x1*scale*zoom+panX,cy-y2*scale*zoom+panY]}
function planPos(v,r){const vs=current.mesh.vertices;let minE=Infinity,maxE=-Infinity,minN=Infinity,maxN=-Infinity;for(const p of vs){minE=Math.min(minE,p.east);maxE=Math.max(maxE,p.east);minN=Math.min(minN,p.north);maxN=Math.max(maxN,p.north)}const pad=35,sx=(r.width-2*pad)/(maxE-minE||1),sy=(r.height-2*pad)/(maxN-minN||1),s=Math.min(sx,sy);return [pad+(v.east-minE)*s,r.height-pad-(v.north-minN)*s]}
function draw(){const r=canvas.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);if(!current){ctx.fillStyle='#728096';ctx.font='16px Segoe UI';ctx.fillText('Selecione SAU3/SAU4 e abra uma superfície.',20,34);return}if(display==='plan'){drawPlan(r);return}const vs=current.mesh.vertices;let md=1;for(const v of vs)md=Math.max(md,Math.hypot(v.x,v.y));const scale=Math.min(r.width,r.height)/(md*2.35);const pts=vs.map(v=>project3(v,scale,r.width/2,r.height/2));for(const f of current.mesh.faces){const a=pts[f[0]],b=pts[f[1]],c=pts[f[2]],avg=(vs[f[0]].z+vs[f[1]].z+vs[f[2]].z)/3,t=(avg-current.mesh.zmin)/(current.mesh.zmax-current.mesh.zmin||1);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.closePath();ctx.fillStyle=`rgb(${60+Math.round(160*t)},${150-Math.round(50*t)},${205-Math.round(105*t)})`;ctx.fill();if(showWire){ctx.strokeStyle=selectedEdge?'#6b7785':'#596877';ctx.lineWidth=.65;ctx.stroke()}}if(showPoints){ctx.fillStyle='#18212b';for(const p of pts){ctx.beginPath();ctx.arc(p[0],p[1],2,0,Math.PI*2);ctx.fill()}}ctx.fillStyle='#43515f';ctx.font='12px Segoe UI';ctx.fillText(`TIN · ${current.mesh.triangles} triângulos`,12,r.height-14)}
function drawPlan(r){for(const f of current.mesh.faces){const p0=planPos(current.mesh.vertices[f[0]],r),p1=planPos(current.mesh.vertices[f[1]],r),p2=planPos(current.mesh.vertices[f[2]],r);ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1]);ctx.closePath();ctx.fillStyle='#edf1f5';ctx.fill();if(showWire){ctx.strokeStyle='#9aa6b3';ctx.lineWidth=.65;ctx.stroke()}}if(showPoints){ctx.fillStyle='#1b2733';current.mesh.vertices.forEach(v=>{const p=planPos(v,r);ctx.beginPath();ctx.arc(p[0],p[1],2.3,0,Math.PI*2);ctx.fill()})}ctx.fillStyle='#43515f';ctx.font='12px Segoe UI';ctx.fillText('PLANTA · clique para definir A/B ou selecionar aresta',12,18)}
function nearestVertex(x,y){const r=canvas.getBoundingClientRect();let best=null,bd=Infinity;for(let i=0;i<current.mesh.vertices.length;i++){const p=planPos(current.mesh.vertices[i],r),d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=i}}return best}
function nearestEdge(x,y){const r=canvas.getBoundingClientRect();let best=null,bd=12;const seen=new Set();for(const f of current.mesh.faces){for(const [a,b] of [[f[0],f[1]],[f[1],f[2]],[f[2],f[0]]]){const k=a<b?a+'-'+b:b+'-'+a;if(seen.has(k))continue;seen.add(k);const p=planPos(current.mesh.vertices[a],r),q=planPos(current.mesh.vertices[b],r),dx=q[0]-p[0],dy=q[1]-p[1],len2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((x-p[0])*dx+(y-p[1])*dy)/len2)),px=p[0]+t*dx,py=p[1]+t*dy,d=Math.hypot(x-px,y-py);if(d<bd){bd=d;best=[a,b]}}}return best}
canvas.addEventListener('pointerdown',e=>{if(!current)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(display==='plan'){if(pickMode){const i=nearestVertex(x,y);if(i!=null){const v=current.mesh.vertices[i];$(pickMode==='A'?'Ae':'Be').value=v.east.toFixed(3);$(pickMode==='A'?'An':'Bn').value=v.north.toFixed(3);st(`${pickMode} = ponto ${v.id}`);pickMode=null}}else if(showWire){const ed=nearestEdge(x,y);if(ed){selectedEdge=ed;st(`Aresta selecionada: ${ed[0]}–${ed[1]}`);draw()}}return}drag={x:e.clientX,y:e.clientY,yaw,pitch,panX,panY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||!current||display==='plan')return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(mode==='pan'){panX=drag.panX+dx;panY=drag.panY+dy}else{yaw=drag.yaw+dx*.008;pitch=Math.max(-1.4,Math.min(1.4,drag.pitch+dy*.008))}draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY<0?1.08:.92;zoom=Math.min(8,Math.max(.2,zoom));draw()},{passive:false});
function drawProfile(d){const r=profile.getBoundingClientRect();pctx.clearRect(0,0,r.width,r.height);const all=[...d.profile,...(d.reference?d.reference.profile:[])];if(!all.length)return;const xs=all.map(p=>p.distance),zs=all.map(p=>p.z),xmin=Math.min(...xs),xmax=Math.max(...xs),zmin=Math.min(...zs),zmax=Math.max(...zs),pad={l:45,r:15,t:15,b:28},W=r.width-pad.l-pad.r,H=r.height-pad.t-pad.b, sx=x=>pad.l+(x-xmin)/(xmax-xmin||1)*W,sy=z=>pad.t+(zmax-z)/(zmax-zmin||1)*H;pctx.strokeStyle='#aeb8c3';pctx.strokeRect(pad.l,pad.t,W,H);pctx.beginPath();d.profile.forEach((p,i)=>{const x=sx(p.distance),y=sy(p.z);i?pctx.lineTo(x,y):pctx.moveTo(x,y)});pctx.strokeStyle='#2367e8';pctx.lineWidth=2;pctx.stroke();if(d.reference){pctx.beginPath();d.reference.profile.forEach((p,i)=>{const x=sx(p.distance),y=sy(p.z);i?pctx.lineTo(x,y):pctx.moveTo(x,y)});pctx.strokeStyle='#b3261e';pctx.lineWidth=1.7;pctx.stroke()}pctx.fillStyle='#53606c';pctx.font='11px Segoe UI';pctx.fillText(zmax.toFixed(2)+' m',5,14);pctx.fillText(zmin.toFixed(2)+' m',5,r.height-7);pctx.fillText(xmax.toFixed(1)+' m',r.width-52,r.height-7);if(d.reference){pctx.fillStyle='#2367e8';pctx.fillText('Atual',pad.l+5,12);pctx.fillStyle='#b3261e';pctx.fillText('Referência',pad.l+45,12)}}
loadList();resize();
</script></body></html>
